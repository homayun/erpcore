server:
  port: 8080

spring:
  application:
    name: quickstart-app
  datasource:
    url: jdbc:h2:file:./data/quickstart
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true

erp:
  security:
    enabled: true
    jwt:
      # Hardcoded 32+ char secret for demo purposes only
      secret: "quickstart-app-demo-secret-key-32-chars-long"
    admin:
      bootstrap:
        enabled: true
        tenant-id: 11111111-1111-1111-1111-111111111111
        username: admin
        password: AdminPassword1!