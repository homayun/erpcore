# =====================================================================
# Quickstart demo — Render-optimized config
# =====================================================================

server:
  port: ${PORT:8080}

spring:
  application:
    name: quickstart-app

  # ── H2 in-memory (ephemeral, matches Render) ──
  datasource:
    url: jdbc:h2:mem:quickstart;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  # ── JPA ──
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

# ── Actuator on MAIN port ──
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

erp:
  security:
    enabled: true
    jwt:
      secret: "quickstart-app-demo-secret-key-32-chars-long"
    admin:
      bootstrap:
        enabled: true
        tenant-id: 11111111-1111-1111-1111-111111111111
        username: admin
        password: ${ADMIN_PASSWORD:AdminPassword1!}