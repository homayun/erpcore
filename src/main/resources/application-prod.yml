# =====================================================================
# Production profile: -Dspring.profiles.active=prod
# =====================================================================
# NOTHING here has a safe default on purpose: a missing variable stops startup.
# =====================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: erp-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000    # log connections held > 60s
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      password: ${REDIS_PASSWORD}

server:
  port: ${SERVER_PORT:8080}
  # Resolve real client IP from TRUSTED proxies only.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXY_CIDRS:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}}
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict
      timeout: 30m
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

# Actuator on a separate port so it's never exposed on the public listener.
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

erp:
  security:
    jwt:
      secret: ${JWT_SECRET}                # random, ≥32 bytes; no fallback
      # DO NOT set allow-insecure-default-secret. Guard will fail startup
      # if JWT_SECRET is missing or is the placeholder.
    redis:
      enabled: ${ERP_REDIS_ENABLED:true}   # REQUIRED for multi-node
    admin:
      bootstrap:
        enabled: false                      # never in prod

logging:
  level:
    root: INFO
    com.erp: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    SECURITY_AUDIT: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"