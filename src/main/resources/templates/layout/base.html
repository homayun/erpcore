<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content)">
<head>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">ErpCore</title>
    <link rel="stylesheet" th:href="@{/assets/style.css}">
    <script th:src="@{/assets/htmx.min.js}"></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <span class="menu-toggle" id="menuToggle">☰</span>
            <h2>ErpCore ERP</h2>
        </div>
        <div class="topbar-right">
            <span>Welcome, Admin</span>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <nav class="menu">
                <ul class="menu-list">
                    <li class="menu-item">
                        <a th:href="@{/dashboard}" hx-get="/dashboard" hx-target="#main-content" hx-push-url="true" class="menu-link">Dashboard</a>
                    </li>

                    <li class="menu-item has-submenu open">
                        <a href="#" class="menu-link toggle-submenu">Settings <span class="arrow">▼</span></a>
                        <ul class="submenu" style="display: block;">
                            <li><a th:href="@{/admin/settings/master-companies}" hx-get="/admin/settings/master-companies" hx-target="#main-content" hx-push-url="true">Master Company</a></li>
                            <li><a th:href="@{/admin/settings/companies}" hx-get="/admin/settings/companies" hx-target="#main-content" hx-push-url="true">Company</a></li>
                            <li><a th:href="@{/admin/settings/branch}" hx-get="/admin/settings/branch" hx-target="#main-content" hx-push-url="true">Branch</a></li>
                            <li><a th:href="@{/admin/settings/user}" hx-get="/admin/settings/user" hx-target="#main-content" hx-push-url="true">User</a></li>
                            <li><a th:href="@{/admin/settings/role}" hx-get="/admin/settings/role" hx-target="#main-content" hx-push-url="true">Role</a></li>
                            <li><a th:href="@{/admin/settings/permission}" hx-get="/admin/settings/permission" hx-target="#main-content" hx-push-url="true">Permission</a></li>
                            <li><a th:href="@{/admin/settings/user-permission}" hx-get="/admin/settings/user-permission" hx-target="#main-content" hx-push-url="true">User Permission</a></li>
                            <li><a th:href="@{/admin/settings/user-role}" hx-get="/admin/settings/user-role" hx-target="#main-content" hx-push-url="true">User Role</a></li>
                            <li><a th:href="@{/admin/settings/role-permission}" hx-get="/admin/settings/role-permission" hx-target="#main-content" hx-push-url="true">Role Permission</a></li>
                            <li><a th:href="@{/admin/settings/code-setting}" hx-get="/admin/settings/code-setting" hx-target="#main-content" hx-push-url="true">Code Setting</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="main-content" id="main-content">
            <div th:replace="${content}"></div>
        </main>
    </div>

    <script th:src="@{/js/layout.js}"></script>
</body>
</html>
