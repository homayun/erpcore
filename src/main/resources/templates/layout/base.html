<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">

    <!-- CSRF meta for JS-driven requests (login, logout, HTMX) -->
    <meta name="_csrf"        th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <!-- HTMX config hardening: no inline <script> tags processed on swap. -->
    <meta name="htmx-config" content='{"allowScriptTags":false,"selfRequestsOnly":true}'>
    <!-- (allowEval=false is NOT set: existing templates use hx-on: handlers.) -->

    <title th:text="${pageTitle} ?: 'ErpCore'">ErpCore</title>
    <link rel="icon" href="data:,">       <!-- suppress favicon 404 noise -->
    <link rel="stylesheet" th:href="@{/assets/style.css}">
    <script th:src="@{/assets/htmx.min.js}" defer></script>
</head>
<body>
    <!-- Skip navigation for keyboard/screen-reader users -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">ErpCore</div>
        <nav class="menu" aria-label="Main navigation">
            <ul class="menu-list">
                <li class="menu-item">
                    <a th:href="@{/dashboard}" hx-get="/dashboard"
                       hx-target="#main-content" hx-push-url="true"
                       class="menu-link">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        Dashboard
                    </a>
                </li>

                <li class="menu-item has-submenu">
                    <button type="button" class="menu-link toggle-submenu"
                            aria-expanded="false" aria-controls="settings-submenu">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        Settings <span class="arrow" aria-hidden="true">▼</span>
                    </button>
                    <ul class="submenu" id="settings-submenu">
                        <li><a th:href="@{/admin/settings/master-companies}" hx-get="/admin/settings/master-companies" hx-target="#main-content" hx-push-url="true">Master Company</a></li>
                        <li><a th:href="@{/admin/settings/companies}" hx-get="/admin/settings/companies" hx-target="#main-content" hx-push-url="true">Company</a></li>
                        <li><a th:href="@{/admin/settings/branches}" hx-get="/admin/settings/branches" hx-target="#main-content" hx-push-url="true">Branch</a></li>
                        <li><a th:href="@{/admin/settings/users}" hx-get="/admin/settings/users" hx-target="#main-content" hx-push-url="true">User</a></li>
                        <li><a th:href="@{/admin/settings/roles}" hx-get="/admin/settings/roles" hx-target="#main-content" hx-push-url="true">Role</a></li>
                        <li><a th:href="@{/admin/settings/permissions}" hx-get="/admin/settings/permissions" hx-target="#main-content" hx-push-url="true">Permission</a></li>
                        <li><a th:href="@{/admin/settings/user-permission}" hx-get="/admin/settings/user-permission" hx-target="#main-content" hx-push-url="true">User Permission</a></li>
                        <li><a th:href="@{/admin/settings/user-role}" hx-get="/admin/settings/user-role" hx-target="#main-content" hx-push-url="true">User Role</a></li>
                        <li><a th:href="@{/admin/settings/role-permission}" hx-get="/admin/settings/role-permission" hx-target="#main-content" hx-push-url="true">Role Permission</a></li>
                        <li><a th:href="@{/admin/settings/code-settings}" hx-get="/admin/settings/code-settings" hx-target="#main-content" hx-push-url="true">Code Setting</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- ==================== TOPBAR ==================== -->
    <header class="topbar">
        <div class="topbar-left">
            <h2 th:text="${pageTitle}">Dashboard</h2>
        </div>
        <div class="topbar-right">

            <!-- Division switcher: ONE form, no duplicate id. -->
            <form th:if="${hasMultipleDivisions}" class="division-switcher"
                  th:attr="aria-label='Filter by division'">
                <select id="divisionSelect" onchange="switchDivision(this.value)"
                        aria-label="Filter by division">
                    <option value="">All Divisions</option>
                    <option th:each="d : ${availableDivisions}"
                            th:value="${d.id}"
                            th:text="${d.name}"
                            th:selected="${d.id == activeDivisionId}"></option>
                </select>
            </form>

            <!-- Profile dropdown: hover + keyboard + click (JS handles focus) -->
            <div class="dropdown">
                <button type="button" class="user-profile" aria-haspopup="true"
                        aria-expanded="false" aria-controls="profile-menu">
                    <div class="avatar" aria-hidden="true">A</div>
                    <div class="user-info">
                        <span class="user-name">Admin</span>
                        <span class="user-role">Administrator</span>
                    </div>
                    <span class="dropdown-icon" aria-hidden="true">▼</span>
                </button>
                <div class="dropdown-menu" id="profile-menu" role="menu">
                    <a href="#" role="menuitem">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        My Profile
                    </a>
                    <a href="#" id="logoutBtn" class="danger" role="menuitem">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        Logout
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content" id="main-content" tabindex="-1">
        <div th:replace="${content}"></div>
    </main>

    <script th:src="@{/js/layout.js}" defer></script>
</body>
</html>
