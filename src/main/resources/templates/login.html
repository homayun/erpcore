<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - ErpCore</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 320px; }
        h1 { margin-top: 0; color: #333; }
        input { display: block; width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; margin-top: 8px; }
        button:hover { background: #0055aa; }
        .error { color: red; margin: 8px 0; font-size: 13px; }
    </style>
</head>
<body>
<div class="login-box">
    <h1>ErpCore</h1>
    <p id="error" class="error" style="display:none;"></p>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username or Email" required autofocus>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>
<script src="/js/login.js" defer></script>
</body>
</html>
