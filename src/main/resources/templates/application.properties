# Flyway verbose logging — EXACT SQL error দেখতে দরকার
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.flyway=DEBUG

# প্রতি test run-এ সম্পূর্ণ আলাদা in-memory DB (এক JVM-এ cross-context দূষণ বন্ধ)
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver

# Test-only safety net: if validation fails, wipe & re-migrate
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true
spring.flyway.validate-on-migrate=true

# Hibernate শুধু validate (Flyway-ই একমাত্র schema owner)
spring.jpa.hibernate.ddl-auto=validate