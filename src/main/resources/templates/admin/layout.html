<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${pageTitle} ?: 'ErpCore Admin'">ErpCore Admin</title>
    <link rel="stylesheet" th:href="@{/assets/style.css}">
    <script th:src="@{/assets/htmx.min.js}" defer></script>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">ErpCore</div>
        <nav class="menu">
            <ul class="menu-list">
                <li class="menu-item">
                    <a th:href="@{/dashboard}" class="menu-link">Dashboard</a>
                </li>
                <li class="menu-item"><a th:href="@{/admin/settings/roles}" class="menu-link">Roles</a></li>
                <li class="menu-item"><a th:href="@{/admin/settings/users}" class="menu-link">Users</a></li>
                <li class="menu-item"><a th:href="@{/admin/settings/role-permission}" class="menu-link">Role Permission</a></li>
                <li class="menu-item"><a th:href="@{/admin/settings/user-role}" class="menu-link">User Role</a></li>
            </ul>
        </nav>
    </aside>

    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left"><h2 th:text="${pageTitle}">Admin</h2></div>
            <div class="topbar-right">
                <span th:text="${username} ?: 'Admin'">Admin</span>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-primary"
                            style="padding: 6px 12px; font-size: 0.85rem;">Logout</button>
                </form>
            </div>
        </header>
        <main class="content-area" style="padding: 24px;">
            <div th:replace="${content}"></div>
        </main>
    </div>
</body>
</html>
