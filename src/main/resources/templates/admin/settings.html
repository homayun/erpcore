<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout}">
    <div th:fragment="content">
        <h1 style="margin-bottom: 20px;">Company & Branch Settings</h1>
        
        <div class="card">
            <h3>Company Profile</h3>
            <form th:action="@{/admin/settings/company}" method="post" style="margin-top: 15px;">
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" name="name" class="form-control" required placeholder="Acme Corp">
                </div>
                <div class="form-group">
                    <label>Registration Number</label>
                    <input type="text" name="regNumber" class="form-control">
                </div>
                <div class="form-group">
                    <label>Tax ID / VAT</label>
                    <input type="text" name="taxId" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary">Save Company</button>
            </form>
        </div>

        <div class="card">
            <h3>Branch Setup</h3>
            <p>No branches created yet.</p>
            <button class="btn btn-primary" style="margin-top: 10px;">Add Branch</button>
        </div>
    </div>
</html>
