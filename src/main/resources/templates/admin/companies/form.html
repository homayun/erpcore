<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="form-content" class="modal-content" hx-on:click="event.stopPropagation()">
        <h2>Add New Company</h2>
        <form hx-post="/admin/companies" 
              hx-target="#company-list" 
              hx-swap="beforeend"
              hx-on::after-request="document.getElementById('modal-container').style.display='none'">
            
            <div class="form-group">
                <label>Company Code</label>
                <input type="text" name="code" required placeholder="e.g. CMP-003">
            </div>
            <div class="form-group">
                <label>Company Name</label>
                <input type="text" name="name" required placeholder="e.g. Acme Corp">
            </div>
            
            <div style="text-align: right; margin-top: 1.5rem;">
                <button type="button" class="btn" style="background:#666;" 
                        hx-on:click="document.getElementById('modal-container').style.display='none'">Cancel</button>
                <button type="submit" class="btn">Save Company</button>
            </div>
        </form>
    </div>
</body>
</html>
