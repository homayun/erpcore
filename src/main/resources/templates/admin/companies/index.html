<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Companies', ~{::#companies-content})}">
<head>
    <title>Company Management - ErpCore</title>
</head>
<body>
    <div th:fragment="content" id="companies-content">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Companies</h2>
                <button class="btn" 
                        hx-get="/admin/companies/new" 
                        hx-target="#modal-container" 
                        hx-swap="innerHTML"
                        hx-on:click="document.getElementById('modal-container').style.display='flex'">
                    + Add Company
                </button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>ID / Code</th>
                        <th>Company Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="company-list">
                    <tr>
                        <td>CMP-001</td>
                        <td>ErpCore Bangladesh</td>
                        <td><button class="btn" style="background:#dc3545;">Delete</button></td>
                    </tr>
                    <tr>
                        <td>CMP-002</td>
                        <td>Global Tech Ltd</td>
                        <td><button class="btn" style="background:#dc3545;">Delete</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="modal-container" style="display: none;" class="modal-backdrop" 
             hx-on:click="if(event.target===this) this.style.display='none'"></div>
    </div>
</body>
</html>
