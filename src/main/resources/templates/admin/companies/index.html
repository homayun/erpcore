<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Company Management - ErpCore</title>
    <!-- আপনার আগের লেখা style.css ব্যবহার করছি, তবে এই পেজের জন্য একটু বাড়তি স্টাইল -->
    <style>
        body { font-family: sans-serif; margin: 0; background: #f5f5f5; }
        .header { background: #0066cc; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn { background: #0066cc; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
        .btn:hover { background: #0055aa; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f9f9f9; }
        /* মডাল স্টাইল */
        #modal-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 2rem; border-radius: 8px; width: 400px; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
    </style>
    <!-- HTMX লোড করা হচ্ছে -->
    <script src="/assets/htmx.min.js"></script>
</head>
<body>
<div class="header">
    <h1>Company & Branch Management</h1>
    <a href="/dashboard" class="btn">Back to Dashboard</a>
</div>
<div class="container">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Companies</h2>
            <!-- HTMX: বাটনে ক্লিক করলে /new থেকে ফর্ম লোড হয়ে মডালে বসবে -->
            <button class="btn" 
                    hx-get="/admin/companies/new" 
                    hx-target="#modal-container" 
                    hx-swap="innerHTML"
                    onclick="document.getElementById('modal-container').style.display='flex'">
                + Add Company
            </button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>ID / Code</th>
                    <th>Company Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="company-list">
                <!-- ডেমো ডেটা (পরে আমরা ডাটাবেস থেকে আসবো) -->
                <tr>
                    <td>CMP-001</td>
                    <td>ErpCore Bangladesh</td>
                    <td><button class="btn" style="background:#dc3545;">Delete</button></td>
                </tr>
                <tr>
                    <td>CMP-002</td>
                    <td>Global Tech Ltd</td>
                    <td><button class="btn" style="background:#dc3545;">Delete</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- মডাল কন্টেইনার (HTMX এখানে ফর্ম ঢুকাবে) -->
<div id="modal-container" onclick="if(event.target===this) this.style.display='none'"></div>

</body>
</html>
