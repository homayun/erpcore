<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Users', ~{::#content})}">
<head><title>Users</title></head>
<body>
    <div th:fragment="content" id="content">
        <div class="card">
            <h2>User Management</h2>
            <div class="toolbar">
                <div class="filter-group">
                    <a th:href="@{/admin/settings/users(filter='all')}" hx-get="/admin/settings/users?filter=all" hx-target="#content" class="filter-btn" th:classappend="${filter == 'all' ? 'active active-all' : ''}">All</a>
                    <a th:href="@{/admin/settings/users(filter='active')}" hx-get="/admin/settings/users?filter=active" hx-target="#content" class="filter-btn" th:classappend="${filter == 'active' ? 'active active-active' : ''}">Active</a>
                    <a th:href="@{/admin/settings/users(filter='deleted')}" hx-get="/admin/settings/users?filter=deleted" hx-target="#content" class="filter-btn" th:classappend="${filter == 'deleted' ? 'active active-deleted' : ''}">Deleted</a>
                </div>
                <div class="actions-group">
                    <button class="btn btn-primary" hx-get="/admin/settings/users/new" hx-target="#modal-container" hx-swap="innerHTML">Add User</button>
                </div>
            </div>
            <table>
                <thead><tr><th>Username</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="user-list">
                    <th:block th:each="u : ${users}">
                        <tr th:replace="~{admin/settings/users/row :: row}"></tr>
                    </th:block>
                </tbody>
            </table>
        </div>
        <div id="modal-container" style="display: none;" class="modal-backdrop"></div>
    </div>
</body>
</html>
