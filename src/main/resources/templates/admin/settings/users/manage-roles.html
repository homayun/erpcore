<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="form-content" class="modal-content">
        <h2>Manage Roles</h2>
        <form th:attr="hx-post='/admin/settings/users/' + ${userId} + '/manage-roles'" hx-target="#modal-container" hx-swap="none">
            <div style="max-height: 300px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px;">
                <p th:if="${#lists.isEmpty(allRoles)}" style="color:#64748b; font-size:13px; text-align:center;">No roles available. Create one first.</p>
                <label th:each="role : ${allRoles}" style="display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #f1f5f9; cursor: pointer;">
                    <input type="checkbox" name="roleIds" th:value="${role.id}" th:checked="${assignedRoles.contains(role.id)}" style="width:16px; height:16px; cursor:pointer;">
                    <span style="font-weight: 500; font-size: 14px;" th:text="${role.name}">Role</span>
                </label>
            </div>
            <div style="text-align: right; margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                <button type="button" class="btn close-modal" style="background:#f1f5f9; color:#475569;">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Roles</button>
            </div>
        </form>
    </div>
</body>
</html>
