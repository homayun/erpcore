<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <tr th:fragment="row" th:id="'row-' + ${u.actorId}">
        <td style="font-weight:600; color:#4f46e5;" th:text="${u.username}">User</td>
        <td>
            <span th:if="${u.enabled}" class="badge badge-success">Active</span>
            <span th:unless="${u.enabled}" class="badge badge-danger">Deleted</span>
        </td>
        <td style="display: flex; gap: 8px;">
            <button th:if="${u.enabled}" class="btn-action btn-soft-delete" th:attr="hx-post='/admin/settings/users/' + ${u.actorId} + '/soft-delete'" hx-target="closest tr" hx-swap="outerHTML swap:0.5s">Soft Delete</button>
            <button th:unless="${u.enabled}" class="btn-action btn-restore" th:attr="hx-post='/admin/settings/users/' + ${u.actorId} + '/restore'" hx-target="closest tr" hx-swap="outerHTML swap:0.5s">Restore</button>
            <button class="btn-action btn-hard-delete" th:attr="hx-delete='/admin/settings/users/' + ${u.actorId}" hx-confirm="Permanently delete?" hx-target="closest tr" hx-swap="outerHTML swap:0.5s">Delete</button>
        </td>
    </tr>
    <span th:fragment="empty"></span>
</body>
</html>
