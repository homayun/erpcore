<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="form-content" class="modal-content">
        <h2 th:text="${company == null ? 'Add Company' : 'Edit Company'}">Add</h2>
        <form th:if="${company == null}" hx-post="/admin/settings/companies" hx-target="#company-list" hx-swap="beforeend">
            <div class="form-group">
                <label>Master Company (Group)</label>
                <select name="masterCompanyId" required style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
                    <option value="">Select Group</option>
                    <option th:each="mc : ${masterCompanies}" th:value="${mc.id}" th:text="${mc.name}"></option>
                </select>
            </div>
            <div class="form-group"><label>Company Name</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Reg. Number</label><input type="text" name="regNumber" required></div>
            <div class="form-group"><label>Tax ID</label><input type="text" name="taxId"></div>
            <div style="text-align: right; margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                <button type="button" class="btn close-modal" style="background:#f1f5f9; color:#475569;">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
        <form th:if="${company != null}" th:attr="hx-post='/admin/settings/companies/' + ${company.id}" hx-target="closest tr" hx-swap="outerHTML">
            <div class="form-group">
                <label>Master Company (Group)</label>
                <select name="masterCompanyId" required style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
                    <option th:each="mc : ${masterCompanies}" th:value="${mc.id}" th:text="${mc.name}" th:selected="${mc.id == company.masterCompanyId}"></option>
                </select>
            </div>
            <div class="form-group"><label>Company Name</label><input type="text" name="name" th:value="${company.name}" required></div>
            <div class="form-group"><label>Reg. Number</label><input type="text" name="regNumber" th:value="${company.registrationNumber}" required></div>
            <div class="form-group"><label>Tax ID</label><input type="text" name="taxId" th:value="${company.taxId}"></div>
            <div style="text-align: right; margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                <button type="button" class="btn close-modal" style="background:#f1f5f9; color:#475569;">Cancel</button>
                <button type="submit" class="btn btn-primary">Update</button>
            </div>
        </form>
    </div>
</body>
</html>
