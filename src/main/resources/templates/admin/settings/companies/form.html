<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="form-content" class="modal-content">
        <h2>Add New Company</h2>
        <form hx-post="/admin/settings/companies" hx-target="#company-list" hx-swap="beforeend">
            
            <div class="form-group">
                <label>Master Company (Group)</label>
                <select name="masterCompanyId" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="">Select Master Company</option>
                    <option th:each="mc : ${masterCompanies}" th:value="${mc.id}" th:text="${mc.name}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Company Name</label>
                <input type="text" name="name" required placeholder="e.g. Acme Corp">
            </div>
            <div class="form-group">
                <label>Registration Number</label>
                <input type="text" name="regNumber" required placeholder="e.g. REG-2026-001">
            </div>
            <div class="form-group">
                <label>Tax ID</label>
                <input type="text" name="taxId" placeholder="e.g. TAX-998877">
            </div>
            
            <div style="text-align: right; margin-top: 1.5rem;">
                <button type="button" class="btn close-modal" style="background:#666;">Cancel</button>
                <button type="submit" class="btn">Save Company</button>
            </div>
        </form>
    </div>
</body>
</html>
