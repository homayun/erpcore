<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="form-content" class="modal-content">
        <h2 th:text="${branch == null ? 'Add Branch' : 'Edit Branch'}">Add</h2>
        <form th:if="${branch == null}" hx-post="/admin/settings/branches" hx-target="#branch-list" hx-swap="beforeend">
            <div class="form-group">
                <label>Company</label>
                <select name="companyId" required style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
                    <option value="">Select Company</option>
                    <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
            </div>
            <div class="form-group"><label>Branch Name</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Branch Code</label><input type="text" name="code" required></div>
            <div style="text-align: right; margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                <button type="button" class="btn close-modal" style="background:#f1f5f9; color:#475569;">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
        <form th:if="${branch != null}" th:attr="hx-post='/admin/settings/branches/' + ${branch.id}" hx-target="closest tr" hx-swap="outerHTML">
            <div class="form-group">
                <label>Company</label>
                <select name="companyId" required style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
                    <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == branch.companyId}"></option>
                </select>
            </div>
            <div class="form-group"><label>Branch Name</label><input type="text" name="name" th:value="${branch.name}" required></div>
            <div class="form-group"><label>Branch Code</label><input type="text" name="code" th:value="${branch.branchCode}" required></div>
            <div style="text-align: right; margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                <button type="button" class="btn close-modal" style="background:#f1f5f9; color:#475569;">Cancel</button>
                <button type="submit" class="btn btn-primary">Update</button>
            </div>
        </form>
    </div>
</body>
</html>
