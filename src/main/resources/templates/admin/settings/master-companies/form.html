<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="form-content" class="modal-content">
        <h2>Add New Master Company (Group)</h2>
        <form hx-post="/admin/settings/master-companies" hx-target="#master-company-list" hx-swap="beforeend">
            
            <div class="form-group">
                <label>Group Code</label>
                <input type="text" name="code" required placeholder="e.g. GRP-002">
            </div>
            <div class="form-group">
                <label>Group Name</label>
                <input type="text" name="name" required placeholder="e.g. Bashundhara Group">
            </div>
            
            <div style="text-align: right; margin-top: 1.5rem;">
                <button type="button" class="btn close-modal" style="background:#666;">Cancel</button>
                <button type="submit" class="btn">Save Master Company</button>
            </div>
        </form>
    </div>
</body>
</html>
