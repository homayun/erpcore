<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Master Companies', ~{::#master-companies-content})}">
<head><title>Master Companies</title></head>
<body>
    <div th:fragment="content" id="master-companies-content">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Master Company (Group) Management</h2>
                <button class="btn" hx-get="/admin/settings/master-companies/new" hx-target="#modal-container" hx-swap="innerHTML">+ Add Master Company</button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Group Code</th>
                        <th>Group Name</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="master-company-list">
                    <tr th:each="mc : ${masterCompanies}">
                        <td th:text="${mc.code}">GRP-001</td>
                        <td th:text="${mc.name}">Default Group</td>
                        <td>
                            <span th:if="${mc.isActive}" style="color:green;">Active</span>
                        </td>
                        <td>
                            <button class="btn" style="background:#dc3545;" th:attr="hx-delete='/admin/settings/master-companies/' + ${mc.id}" hx-target="closest tr" hx-swap="outerHTML swap:0.5s">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div id="modal-container" style="display: none;" class="modal-backdrop"></div>
    </div>
</body>
</html>
