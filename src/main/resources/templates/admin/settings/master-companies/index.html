<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Master Companies', ~{::#master-companies-content})}">
<head><title>Master Companies</title></head>
<body>
    <div th:fragment="content" id="master-companies-content">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>Master Company (Group) Management</h2>
                <div style="display: flex; gap: 10px;">
                    <a href="/admin/settings/master-companies/export" class="btn" style="background:#28a745; text-decoration:none;">Export CSV</a>
                    
                    <form hx-post="/admin/settings/master-companies/import" hx-encoding="multipart/form-data" hx-target="#master-companies-content" hx-swap="outerHTML" style="display: flex; gap: 5px; margin: 0;">
                        <input type="file" name="file" accept=".csv" required style="padding: 5px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px;">
                        <button type="submit" class="btn" style="background:#17a2b8;">Import</button>
                    </form>

                    <button class="btn" hx-get="/admin/settings/master-companies/new" hx-target="#modal-container" hx-swap="innerHTML">+ Add</button>
                </div>
            </div>

            <div style="margin-bottom: 15px;">
                <a th:href="@{/admin/settings/master-companies(filter='all')}" hx-get="/admin/settings/master-companies?filter=all" hx-target="#master-companies-content" hx-push-url="true" class="btn" th:classappend="${filter == 'all' ? 'active' : ''}" style="background:#666;">All</a>
                <a th:href="@{/admin/settings/master-companies(filter='active')}" hx-get="/admin/settings/master-companies?filter=active" hx-target="#master-companies-content" hx-push-url="true" class="btn" th:classappend="${filter == 'active' ? 'active' : ''}" style="background:#28a745;">Active</a>
                <a th:href="@{/admin/settings/master-companies(filter='deleted')}" hx-get="/admin/settings/master-companies?filter=deleted" hx-target="#master-companies-content" hx-push-url="true" class="btn" th:classappend="${filter == 'deleted' ? 'active' : ''}" style="background:#dc3545;">Deleted</a>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Group Code</th>
                        <th>Group Name</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="master-company-list">
                    <th:block th:each="mc : ${masterCompanies}">
                        <tr th:replace="~{admin/settings/master-companies/row :: row}"></tr>
                    </th:block>
                </tbody>
            </table>
        </div>
        <div id="modal-container" style="display: none;" class="modal-backdrop"></div>
    </div>
</body>
</html>
