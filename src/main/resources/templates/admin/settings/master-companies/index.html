<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Master Companies', ~{::#master-companies-content})}">
<head><title>Master Companies</title></head>
<body>
    <div th:fragment="content" id="master-companies-content">
        <div class="card">
            <h2>Master Company (Group) Management</h2>
            
            <div class="toolbar">
                <div class="filter-group">
                    <a th:href="@{/admin/settings/master-companies(filter='all')}" hx-get="/admin/settings/master-companies?filter=all" hx-target="#master-companies-content" hx-push-url="true" class="filter-btn" th:classappend="${filter == 'all' ? 'active active-all' : ''}">All</a>
                    <a th:href="@{/admin/settings/master-companies(filter='active')}" hx-get="/admin/settings/master-companies?filter=active" hx-target="#master-companies-content" hx-push-url="true" class="filter-btn" th:classappend="${filter == 'active' ? 'active active-active' : ''}">Active</a>
                    <a th:href="@{/admin/settings/master-companies(filter='deleted')}" hx-get="/admin/settings/master-companies?filter=deleted" hx-target="#master-companies-content" hx-push-url="true" class="filter-btn" th:classappend="${filter == 'deleted' ? 'active active-deleted' : ''}">Deleted</a>
                </div>

                <div class="actions-group">
                    <a href="/admin/settings/master-companies/export" class="btn" style="background:white; border:1px solid #e2e8f0; color:#1e293b;">📥 Export CSV</a>
                    
                    <form hx-post="/admin/settings/master-companies/import" hx-encoding="multipart/form-data" hx-target="#master-companies-content" hx-swap="outerHTML" style="margin: 0;">
                        <div class="file-upload-wrapper">
                            <label for="csvFile" class="file-upload-label">📤 Choose CSV</label>
                            <input type="file" id="csvFile" name="file" accept=".csv" required onchange="this.form.requestSubmit();">
                        </div>
                    </form>

                    <button class="btn btn-primary" hx-get="/admin/settings/master-companies/new" hx-target="#modal-container" hx-swap="innerHTML">Add New</button>
                </div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Group Code</th>
                        <th>Group Name</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="master-company-list">
                    <th:block th:each="mc : ${masterCompanies}">
                        <tr th:replace="~{admin/settings/master-companies/row :: row}"></tr>
                    </th:block>
                </tbody>
            </table>
        </div>
        <div id="modal-container" style="display: none;" class="modal-backdrop"></div>
    </div>
</body>
</html>
