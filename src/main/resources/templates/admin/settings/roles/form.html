<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="form-content" class="modal-content">
        <h2 th:text="${r == null ? 'Add Role' : 'Edit Role'}">Add</h2>
        <form th:if="${r == null}" hx-post="/admin/settings/roles" hx-target="#content" hx-swap="innerHTML">
            <div class="form-group"><label>Role Name</label><input type="text" name="name" required placeholder="e.g. MANAGER"></div>
            <div class="form-group"><label>Hierarchy Level (1-100)</label><input type="number" name="level" required value="10"></div>
            <div style="text-align: right; margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                <button type="button" class="btn close-modal" style="background:#f1f5f9; color:#475569;">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
        <form th:if="${r != null}" th:attr="hx-post='/admin/settings/roles/' + ${r.id}" hx-target="closest tr" hx-swap="outerHTML">
            <div class="form-group"><label>Role Name</label><input type="text" name="name" th:value="${r.name}" required></div>
            <div class="form-group"><label>Hierarchy Level</label><input type="number" name="level" th:value="${r.hierarchyLevel}" required></div>
            <div style="text-align: right; margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                <button type="button" class="btn close-modal" style="background:#f1f5f9; color:#475569;">Cancel</button>
                <button type="submit" class="btn btn-primary">Update</button>
            </div>
        </form>
    </div>
</body>
</html>
