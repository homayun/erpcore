<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Permissions', ~{::#content})}">
<head><title>Permissions</title></head>
<body>
    <div th:fragment="content" id="content">
        <div class="card">
            <h2>Permission Catalog</h2>

            <div class="toolbar">
                <div class="filter-group">
                    <a th:href="@{/admin/settings/permissions(filter='all')}"
                       hx-get="/admin/settings/permissions?filter=all"
                       hx-target="#content" hx-push-url="true"
                       class="filter-btn"
                       th:classappend="${filter == 'all' ? 'active active-all' : ''}">All</a>
                    <a th:href="@{/admin/settings/permissions(filter='active')}"
                       hx-get="/admin/settings/permissions?filter=active"
                       hx-target="#content" hx-push-url="true"
                       class="filter-btn"
                       th:classappend="${filter == 'active' ? 'active active-active' : ''}">Active</a>
                    <a th:href="@{/admin/settings/permissions(filter='deleted')}"
                       hx-get="/admin/settings/permissions?filter=deleted"
                       hx-target="#content" hx-push-url="true"
                       class="filter-btn"
                       th:classappend="${filter == 'deleted' ? 'active active-deleted' : ''}">Deleted</a>
                </div>
                <div class="actions-group">
                    <button class="btn btn-primary"
                            hx-get="/admin/settings/permissions/new"
                            hx-target="#modal-container"
                            hx-swap="innerHTML">Add Permission</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Permission Key</th>
                        <th>Group</th>
                        <th>Description</th>
                        <th>Sensitive</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="permission-list">
                    <th:block th:each="p : ${permissions}">
                        <tr th:replace="~{admin/settings/permissions/row :: row}"></tr>
                    </th:block>
                </tbody>
            </table>
        </div>
        <div id="modal-container" style="display: none;" class="modal-backdrop"></div>
    </div>
</body>
</html>
