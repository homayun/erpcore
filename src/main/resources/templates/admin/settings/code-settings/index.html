<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Code Settings', ~{::#content})}">
<head><title>Code Settings</title></head>
<body>
    <div th:fragment="content" id="content">
        <div class="card">
            <h2>Code Setting Management</h2>
            <div class="toolbar">
                <div class="filter-group">
                    <a th:href="@{/admin/settings/code-settings(filter='all')}" hx-get="/admin/settings/code-settings?filter=all" hx-target="#content" class="filter-btn" th:classappend="${filter == 'all' ? 'active active-all' : ''}">All</a>
                    <a th:href="@{/admin/settings/code-settings(filter='active')}" hx-get="/admin/settings/code-settings?filter=active" hx-target="#content" class="filter-btn" th:classappend="${filter == 'active' ? 'active active-active' : ''}">Active</a>
                    <a th:href="@{/admin/settings/code-settings(filter='deleted')}" hx-get="/admin/settings/code-settings?filter=deleted" hx-target="#content" class="filter-btn" th:classappend="${filter == 'deleted' ? 'active active-deleted' : ''}">Deleted</a>
                </div>
                <div class="actions-group">
                    <button class="btn btn-primary" hx-get="/admin/settings/code-settings/new" hx-target="#modal-container" hx-swap="innerHTML">Add Code</button>
                </div>
            </div>
            <table>
                <thead><tr><th>Category</th><th>Code</th><th>Name</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="code-list">
                    <th:block th:each="c : ${settings}"><tr th:replace="~{admin/settings/code-settings/row :: row}"></tr></th:block>
                </tbody>
            </table>
        </div>
        <div id="modal-container" style="display: none;" class="modal-backdrop"></div>
    </div>
</body>
</html>
