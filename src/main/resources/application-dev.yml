# =====================================================================
# Dev profile — activate with: --spring.profiles.active=dev
# =====================================================================
erp:
  security:
    jwt:
      allow-insecure-default-secret: true
    login:
      # Dev users only enter username+password; this tenant is used.
      default-tenant-id: "11111111-1111-1111-1111-111111111111"
    admin:
      bootstrap:
        enabled: true
        tenant-id: 11111111-1111-1111-1111-111111111111
        username: admin
        password: ${ERP_ADMIN_BOOTSTRAP_PASSWORD:AdminPassword1!}