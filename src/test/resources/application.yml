# =====================================================================
# Test-only defaults — NOT used by production build
# =====================================================================
# Explicit overrides ensure test contexts do NOT depend on main config
# parsing. Any change to main application.yml cannot accidentally weaken
# test-time security or leak lazy-loading behavior.

spring:
  jpa:
    open-in-view: false
  data:
    redis:
      repositories:
        enabled: false

erp:
  security:
    jwt:
      # Test uses the guard's dev allow flag so app boots without env vars
      allow-insecure-default-secret: true
    admin:
      bootstrap:
        enabled: true
        tenant-id: 11111111-1111-1111-1111-111111111111
        username: admin
        password: AdminPassword1!